<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocAction AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Pretendard", "IBM Plex Sans KR", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
      body { font-family: Pretendard, system-ui, sans-serif; }
      .msg-user { background: #0f172a; color: #f8fafc; }
      .msg-ai { background: #fff; border: 1px solid #e2e8f0; }
      .thinking-dot {
        width: 6px; height: 6px; border-radius: 999px; background: #64748b;
        animation: thinking-bounce 1.1s infinite ease-in-out;
      }
      .thinking-dot:nth-child(2) { animation-delay: 0.15s; }
      .thinking-dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes thinking-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
        40% { transform: translateY(-4px); opacity: 1; }
      }
      .streaming-caret::after {
        content: "▌";
        margin-left: 1px;
        color: #0f172a;
        animation: caret-blink 1s step-end infinite;
      }
      @keyframes caret-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      #drop-overlay {
        background: rgba(15, 23, 42, 0.45);
      }
      .drop-panel {
        outline: 2px dashed #0f172a;
        outline-offset: -12px;
      }
      .indet-track {
        height: 8px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
      }
      .indet-bar {
        width: 36%;
        height: 100%;
        background: #0f172a;
        border-radius: 999px;
        animation: indet-slide 1.2s ease-in-out infinite;
      }
      @keyframes indet-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      #pdf-modal { background: rgba(15, 23, 42, 0.55); }
      #chat-list::-webkit-scrollbar, #preview-body::-webkit-scrollbar, #chat-nav::-webkit-scrollbar, #doc-list::-webkit-scrollbar {
        width: 8px;
      }
      #chat-list::-webkit-scrollbar-thumb, #preview-body::-webkit-scrollbar-thumb, #chat-nav::-webkit-scrollbar-thumb, #doc-list::-webkit-scrollbar-thumb {
        background: #cbd5e1; border-radius: 8px;
      }
      #workspace.preview-open {
        grid-template-columns: 260px minmax(0, 1fr) minmax(360px, 0.9fr);
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-900 h-screen overflow-hidden">
    <div class="h-full flex flex-col">
      <header class="h-14 px-5 flex items-center justify-between bg-white border-b border-slate-200">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-md bg-slate-900 text-white grid place-items-center text-xs font-semibold">DA</div>
          <div>
            <div class="text-sm font-semibold leading-tight">DocAction AI</div>
            <div class="text-[11px] text-slate-500">Document → Action → Execution</div>
          </div>
        </div>
        <div class="text-xs text-slate-500" id="status-line">문서를 업로드한 뒤 Agent에게 업무를 맡기세요</div>
      </header>

      <main id="workspace" class="flex-1 min-h-0 grid grid-cols-[260px_minmax(0,1fr)] gap-3 p-3">
        <section class="bg-white border border-slate-200 rounded-xl flex flex-col min-h-0 overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-100">
            <div id="project-name" class="text-sm font-semibold truncate">프로젝트</div>
            <div class="text-[11px] text-slate-400">Workspace</div>
          </div>
          <div class="p-2 border-b border-slate-100">
            <button id="new-chat-btn" type="button" class="w-full text-xs px-3 py-2 rounded-lg bg-slate-900 text-white">+ 새 채팅</button>
          </div>
          <div class="px-4 pt-3 pb-1 text-[11px] font-semibold tracking-wide text-slate-500">대화</div>
          <div id="chat-nav" class="overflow-auto p-2 space-y-1 min-h-0 max-h-[38%]"></div>
          <div class="px-4 pt-3 pb-1 border-t border-slate-100 flex items-center justify-between gap-2">
            <span class="text-[11px] font-semibold tracking-wide text-slate-500">문서</span>
            <label class="text-[11px] px-2 py-1 rounded-md bg-slate-900 text-white cursor-pointer shrink-0">
              + 파일 추가
              <input id="file" type="file" accept=".pdf,.docx,.doc,.txt,.md,.hwp,.hwpx,.xlsx,.xls,.csv" class="hidden" />
            </label>
          </div>
          <div id="doc-list" class="flex-1 overflow-auto p-2 space-y-1 min-h-0"></div>
        </section>

        <section class="bg-white border border-slate-200 rounded-xl flex flex-col min-h-0 overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-100">
            <div class="flex items-start justify-between gap-2 mb-2">
              <h2 class="text-xs font-semibold tracking-wide text-slate-500">AGENT CHAT</h2>
              <div id="chat-title" class="text-[11px] text-slate-400 truncate max-w-[60%]">새 대화</div>
            </div>
            <ol id="stepper" class="flex flex-wrap gap-1.5"></ol>
            <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
              <div id="progress-fill" class="h-full w-0 bg-slate-900 transition-all duration-300"></div>
            </div>
            <p id="progress-label" class="mt-1.5 text-[11px] text-slate-400">대기 중</p>
          </div>
          <div id="chat-list" class="flex-1 overflow-auto p-4 space-y-3"></div>
          <div class="border-t border-slate-100 p-3">
            <div class="flex flex-wrap gap-1.5 mb-2" id="chips"></div>
            <div id="ref-docs" class="hidden mb-2"></div>
            <div id="attach-bar" class="hidden mb-2 space-y-1"></div>
            <form id="chat-form" class="flex gap-2">
              <div class="relative shrink-0">
                <button id="attach-toggle" type="button" class="w-10 h-10 grid place-items-center rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50" title="파일 첨부">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21.44 11.05l-8.49 8.49a5.25 5.25 0 01-7.43-7.43l8.49-8.49a3.5 3.5 0 014.95 4.95l-8.49 8.49a1.75 1.75 0 01-2.47-2.47l7.78-7.78"/>
                  </svg>
                </button>
                <div id="attach-menu" class="hidden absolute bottom-12 left-0 z-20 w-48 rounded-lg border border-slate-200 bg-white shadow-lg p-1">
                  <button id="attach-upload" type="button" class="w-full text-left text-xs px-3 py-2 rounded-md hover:bg-slate-50">새 파일 업로드</button>
                  <button id="attach-from-project" type="button" class="w-full text-left text-xs px-3 py-2 rounded-md hover:bg-slate-50">프로젝트 문서에서 선택</button>
                </div>
              </div>
              <input id="chat-file" type="file" accept=".pdf,.docx,.doc,.txt,.md,.hwp,.hwpx,.xlsx,.xls,.csv,.jpg,.jpeg,.png,.gif,.webp" class="hidden" />
              <input
                id="chat-input"
                class="flex-1 text-sm px-3 py-2 rounded-lg border border-slate-200 outline-none focus:border-slate-400"
                placeholder="이 문서 확인해서 우리가 해야 할 일 정리하고 진행해줘."
                autocomplete="off"
              />
              <button id="send-btn" class="text-sm px-4 py-2 rounded-lg bg-slate-900 text-white disabled:opacity-40 disabled:cursor-not-allowed" type="submit">보내기</button>
            </form>
          </div>
        </section>

        <section class="hidden">
          <div id="action-list"></div>
        </section>

        <section id="preview-panel" class="hidden bg-white border border-slate-200 rounded-xl flex-col min-h-0 overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-100 flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h2 class="text-xs font-semibold tracking-wide text-slate-500">PREVIEW</h2>
              <div id="preview-title" class="mt-1 text-sm font-medium truncate">문서 미리보기</div>
              <div id="preview-meta" class="text-[11px] text-slate-400"></div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <a id="preview-download" href="#" class="text-[11px] px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50 pointer-events-none opacity-40">다운로드</a>
              <button id="preview-close" type="button" class="text-[11px] px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50">닫기</button>
            </div>
          </div>
          <div id="preview-toolbar" class="hidden border-b border-slate-100">
            <div class="px-3 py-2 flex flex-wrap items-center gap-1.5">
            <button id="preview-prev" type="button" class="text-[11px] px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50">이전</button>
            <span id="preview-page" class="text-[11px] text-slate-500 min-w-[4.5rem] text-center">1 / 1</span>
            <button id="preview-next" type="button" class="text-[11px] px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50">다음</button>
            <span class="mx-1 w-px h-4 bg-slate-200"></span>
            <button id="preview-zoom-out" type="button" class="text-[11px] px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50">축소</button>
            <span id="preview-zoom" class="text-[11px] text-slate-500 min-w-[2.5rem] text-center">100%</span>
            <button id="preview-zoom-in" type="button" class="text-[11px] px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50">확대</button>
            <button id="preview-fit" type="button" class="text-[11px] px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50">화면 맞춤</button>
            </div>
          </div>
          <div id="preview-body" class="flex-1 overflow-auto bg-slate-50"></div>
        </section>
      </main>

      <footer class="hidden">
        <div id="timeline"></div>
        <div id="log"></div>
      </footer>
    </div>

    <div id="drop-overlay" class="hidden fixed inset-0 z-40 flex items-center justify-center p-8" aria-hidden="true">
      <div class="drop-panel w-full max-w-xl bg-white/95 rounded-2xl px-10 py-14 text-center">
        <div class="mx-auto mb-4 w-14 h-14 rounded-xl border border-slate-200 grid place-items-center text-slate-700">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <path d="M14 2v6h6"/>
            <path d="M12 18V11"/>
            <path d="M9 14l3-3 3 3"/>
          </svg>
        </div>
        <p class="text-lg font-semibold text-slate-900">파일을 여기에 놓아주세요</p>
        <p class="mt-3 text-xs text-slate-500">지원 형식: PDF, DOCX, TXT, MD, HWP, HWPX, JPG, PNG · 최대 20MB</p>
      </div>
    </div>

    <div id="pdf-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6">
      <div class="bg-white rounded-xl w-full max-w-4xl h-[80vh] flex flex-col overflow-hidden border border-slate-200">
        <div class="h-12 px-4 flex items-center justify-between border-b border-slate-100">
          <div id="pdf-modal-title" class="text-sm font-medium truncate">PDF 미리보기</div>
          <button id="pdf-modal-close" type="button" class="text-sm px-2 py-1 rounded-md hover:bg-slate-50">닫기</button>
        </div>
        <iframe id="pdf-frame" class="flex-1 w-full bg-slate-100" title="PDF 미리보기"></iframe>
      </div>
    </div>

    <div id="doc-picker" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6" style="background: rgba(15, 23, 42, 0.45)">
      <div class="bg-white rounded-xl w-full max-w-md max-h-[70vh] flex flex-col overflow-hidden border border-slate-200">
        <div class="h-12 px-4 flex items-center justify-between border-b border-slate-100">
          <div class="text-sm font-medium">프로젝트 문서에서 선택</div>
          <button id="doc-picker-close" type="button" class="text-sm px-2 py-1 rounded-md hover:bg-slate-50">닫기</button>
        </div>
        <div id="doc-picker-list" class="flex-1 overflow-auto p-3 space-y-1"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="./js/file-types.js"></script>
    <script src="./js/file-service.js"></script>
    <script src="./js/drop-overlay.js"></script>
    <script src="./js/attachment-bar.js"></script>
    <script src="./js/pdf-modal.js"></script>
    <script src="./js/preview-panel.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
